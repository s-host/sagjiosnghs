<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HyperTunes</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
  <script type="module" src="/themes.js"></script>
  <script src="/script.js" defer></script>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro' rel='stylesheet' type='text/css'>
</head>
<body class="bg-gray-900 text-white">
  <header class="p-6 bg-gray-800 shadow-md flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h1 class="text-3xl font-bold cursor-pointer" onclick="navigateTo('/')">HyperTunes</h1>
      <button id="search-toggle" class="ml-2 p-2 rounded search-toggle" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <form id="search-bar" class="flex items-center ml-2" style="display:none;" onsubmit="handleSearch(event)">
        <input id="search-input" class="p-2 rounded text-black" placeholder="Search tracks, albums, or artists..." autocomplete="off" />
        <button type="submit" id="search-btn" class="ml-2 px-4 py-2 rounded bg-green-600 hover:bg-green-700 text-white">Search</button>
      </form>
    </div>
    <label class="wt-white" for="theme-select">Theme:
      <select id="theme-select">
              <option value="dark" class="text-black">Dark</option>
              <option value="light" class="text-black">Light</option>
              <option value="blue" class="text-black">Blue</option>
              <option value="sc" class="text-black">SC</option>
              <option value="games" class="text-black">Games</option>
              <option value="midnight-blurple" class="text-black">Midnight Blurple</option>
              <option value="strawberry-lemonade" class="text-black">Strawberry Lemonade</option>
              <option value="ocean-breeze" class="text-black">Ocean Breeze</option>
              <option value="sunset-glow" class="text-black">Sunset Glow</option>
              <option value="lavender-dreams" class="text-black">Lavender Dreams</option>
              <option value="aero-glass" class="text-black">Aero Glass</option>
      </select>
    </label>

    <div class="flex items-center space-x-4">
      <a href="/add-song.html" id="add-song-link" style="display:none" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded">
        Add New Song
      </a>

      <div id="login-box" style="display:none;" class="flex space-x-2 items-center">
        <input id="login-username" placeholder="Username" class="px-2 py-1 rounded" />
        <input id="login-password" type="password" placeholder="Password" class="px-2 py-1 rounded" />
        <button onclick="submitLogin()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded login-btn">Log In</button>
      </div>

      <button onclick="navigateTo('/register')" id="register-button" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded navbutton">Sign Up</button>
      <button id="login-button" onclick="showLogin()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded">Sign In</button>
      <button id="logout-button" onclick="logout()" style="display:none;" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded">Log Out</button>
    </div>
  </header>

  <main id="app" class="p-6 space-y-10">
    <section>
      <div id="searchResults" class="hidden"></div>
      
        <h2 class="text-2xl mb-4 font-semibold">Newly Added</h2>
        <div id="new-tracks" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
        </div>
        </section>

        <section>
        <h2 class="text-2xl mb-4 font-semibold">Popular Tracks</h2>
        <div id="popular-tracks" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
        </div>
    </section>
    <script>
      console.log(document.getElementById("searchResults"));
    </script>
  </main>
</body>
</html>
