<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HyperTunes</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
  <script type="module" src="/themes.js"></script>
  <script src="/script.js" defer></script>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro' rel='stylesheet' type='text/css'>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="nav-group">
      <h1 class="app-logo" onclick="navigateTo('/')">HyperTunes</h1>
      <button id="search-toggle" class="btn-icon-search search-toggle" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <form id="search-bar" class="search-form" style="display:none;" onsubmit="handleSearch(event)">
        <input id="search-input" class="input-search" placeholder="Search tracks..." autocomplete="off" />
        <button type="submit" id="search-btn" class="btn-search">Search</button>
      </form>
    </div>
    <label class="theme-label" for="theme-select">Theme:
      <select id="theme-select">
              <option value="dark" class="text-black">Dark</option>
              <option value="light" class="text-black">Light</option>
              <option value="blue" class="text-black">Blue</option>
              <option value="sc" class="text-black">SC</option>
              <option value="games" class="text-black">Games</option>
              <option value="midnight-blurple" class="text-black">Midnight Blurple</option>
              <option value="strawberry-lemonade" class="text-black">Strawberry Lemonade</option>
              <option value="ocean-breeze" class="text-black">Ocean Breeze</option>
              <option value="sunset-glow" class="text-black">Sunset Glow</option>
              <option value="lavender-dreams" class="text-black">Lavender Dreams</option>
              <option value="aero-glass" class="text-black">Aero Glass</option>
      </select>
    </label>

    <div class="nav-actions">
      <!-- Notification Bell -->
      <button id="notification-bell" onclick="toggleNotificationModal()" class="btn-icon-bell notification-bell hidden" aria-label="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-bell"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="notification-badge" class="notification-badge">0</span>
      </button>
      
      <!-- Profile Link -->
      <button id="profile-link" class="hidden nav-link-blue navbutton" aria-label="Profile">
        My Profile
      </button>
      
      <a href="/add-song.html" id="add-song-link" style="display:none" class="nav-link-green">
        Add New Song
      </a>

      <div id="login-box" style="display:none;" class="login-container">
        <input id="login-username" placeholder="Username" class="input-login" />
        <input id="login-password" type="password" placeholder="Password" class="input-login" />
        <button onclick="submitLogin()" class="nav-link-blue login-btn">Log In</button>
      </div>

      <button onclick="navigateTo('/register')" id="register-button" class="nav-link-green navbutton">Sign Up</button>
      <button id="login-button" onclick="showLogin()" class="nav-link-green">Sign In</button>
      <button id="logout-button" onclick="logout()" style="display:none;" class="nav-link-red">Log Out</button>
    </div>
  </header>

  <main id="app" class="app-main">
    <section>
      <div id="searchResults" class="hidden"></div>
      
        <h2 class="section-title">Newly Added</h2>
        <div id="new-tracks" class="track-grid">
        </div>
        </section>

        <section>
        <h2 class="section-title">Popular Tracks</h2>
        <div id="popular-tracks" class="track-grid">
        </div>
    </section>
        </div>
    </section>
    <script>
      console.log(document.getElementById("searchResults"));
    </script>
  </main>
</body>
</html>
