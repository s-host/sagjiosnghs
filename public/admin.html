<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel - HyperTunes</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
  <script type="module" src="/themes.js"></script>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro' rel='stylesheet' type='text/css'>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
  <header class="p-6 bg-gray-800 shadow-md flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h1 class="text-3xl font-bold cursor-pointer" onclick="window.location.href='/'">HyperTunes Admin</h1>
    </div>
    <label class="wt-white" for="theme-select">Theme:
      <select id="theme-select">
              <option value="dark" class="text-black">Dark</option>
              <option value="light" class="text-black">Light</option>
              <option value="blue" class="text-black">Blue</option>
              <option value="sc" class="text-black">SC</option>
              <option value="games" class="text-black">Games</option>
              <option value="midnight-blurple" class="text-black">Midnight Blurple</option>
              <option value="strawberry-lemonade" class="text-black">Strawberry Lemonade</option>
              <option value="ocean-breeze" class="text-black">Ocean Breeze</option>
              <option value="sunset-glow" class="text-black">Sunset Glow</option>
              <option value="forest-night" class="text-black">Forest Night</option>
              <option value="lavender-dreams" class="text-black">Lavender Dreams</option>
      </select>
    </label>
    <div class="flex items-center space-x-4">
      <button onclick="window.location.href='/'" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded navbutton">Back to Home</button>
    </div>
  </header>

  <main class="p-6 max-w-6xl mx-auto">
    <!-- Data Export/Import Section -->
    <div class="mb-8 grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Site Data Export/Import -->
      <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
        <h3 class="text-xl font-bold mb-4 text-blue-400">Site Data Backup</h3>
        <p class="text-gray-300 mb-4 text-sm">Export/Import users, comments, activity, and playlists</p>
        
        <div class="space-y-3">
          <button onclick="exportSiteData()" class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
            📥 Export Site Data
          </button>
          
          <div class="border-t border-gray-600 pt-3">
            <label class="block text-sm font-medium mb-2">Import Site Data:</label>
            <input type="file" id="siteDataFile" accept=".json" class="w-full p-2 rounded bg-gray-700 text-white mb-2" />
            <button onclick="importSiteData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
              📤 Import Site Data
            </button>
          </div>
        </div>
      </div>

      <!-- Tracks Data Export/Import -->
            <!-- Tracks Data Export/Import -->
      <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
        <h3 class="text-xl font-semibold mb-4">Tracks Data Export/Import</h3>
        <p class="text-gray-300 mb-4 text-sm">Export/Import track metadata and audio files</p>
        <div class="space-y-4">
          <div class="flex gap-2">
            <button onclick="exportTracks()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
              Export Tracks Data
            </button>
            <button onclick="exportTrackAudioFiles()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
              Export Audio Files
            </button>
          </div>
          <div>
            <label class="block mb-2">Import Tracks Data:</label>
            <input type="file" id="tracksDataFile" accept=".json" class="mb-2 p-2 w-full bg-gray-700 rounded">
            <button onclick="importTracks()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
              Import Tracks Data
            </button>
          </div>
        </div>
      </div>
    </div>

    <h2 class="text-3xl font-bold mb-6">User Management</h2>
    
    <!-- Search and Stats Section -->
    <div class="mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="flex items-center gap-4">
        <input 
          type="text" 
          id="user-search" 
          placeholder="Search users by username..." 
          class="px-4 py-2 rounded bg-gray-700 text-white border border-gray-600 focus:border-blue-500 focus:outline-none"
        />
        <button onclick="clearSearch()" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded">
          Clear
        </button>
      </div>
      <div id="user-stats" class="text-gray-400">
        <!-- Stats will be inserted here -->
      </div>
    </div>
    
    <div id="loading" class="text-center p-8">
      <p>Loading users...</p>
    </div>

    <div id="users-container" class="hidden">
      <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-700">
            <tr>
              <th class="px-4 py-3 text-left">ID</th>
              <th class="px-4 py-3 text-left">Username</th>
              <th class="px-4 py-3 text-left">Account Type</th>
              <th class="px-4 py-3 text-left">Status</th>
              <th class="px-4 py-3 text-left">Created</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="users-table-body" class="divide-y divide-gray-700">
            <!-- Users will be inserted here -->
          </tbody>
        </table>
      </div>
      
      <!-- Pagination Controls -->
      <div id="pagination-container" class="mt-6 flex items-center justify-center">
        <div class="flex items-center gap-2">
          <button id="prev-page" onclick="changePage(-1)" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded disabled:opacity-50 disabled:cursor-not-allowed">
            Previous
          </button>
          <div id="page-info" class="px-4 py-2 text-gray-300">
            <!-- Page info will be inserted here -->
          </div>
          <button id="next-page" onclick="changePage(1)" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded disabled:opacity-50 disabled:cursor-not-allowed">
            Next
          </button>
        </div>
      </div>
    </div>

    <div id="error-container" class="hidden text-center p-8">
      <div class="bg-red-900 border border-red-600 rounded-lg p-6 max-w-md mx-auto">
        <h3 class="text-xl font-bold mb-2">Access Denied</h3>
        <p id="error-message" class="text-red-200 mb-4"></p>
        <button onclick="window.location.href='/'" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded">
          Go to Home
        </button>
      </div>
    </div>
  </main>

  <script>
    // Export/Import Functions
    async function exportSiteData() {
      try {
        const response = await fetch('/api/admin/export/site-data');
        if (!response.ok) {
          throw new Error('Export failed');
        }
        
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `hypertunes-site-data-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        showImportSuccess('Site data exported successfully!');
      } catch (error) {
        console.error('Export failed:', error);
        showImportError('Failed to export site data: ' + error.message);
      }
    }

    async function exportTracks() {
      try {
        const response = await fetch('/api/tracks');
        if (!response.ok) throw new Error('Failed to fetch tracks data');
        const tracks = await response.json();
        
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const blob = new Blob([JSON.stringify(tracks, null, 2)], { type: 'application/json' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tracks-backup-${timestamp}.json`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        showImportSuccess('Tracks data exported successfully!');
      } catch (error) {
        showImportError('Failed to export tracks: ' + error.message);
      }
    }

    async function exportTrackAudioFiles() {
      try {
        const response = await fetch('/api/tracks');
        if (!response.ok) throw new Error('Failed to fetch tracks data');
        const tracks = await response.json();
        
        // Create list of audio files
        const audioFiles = tracks.filter(track => track.file).map(track => ({
          url: track.file,
          filename: `${track.artist} - ${track.title}${getFileExtension(track.file)}`
            .replace(/[<>:"/\\|?*]/g, '') // Remove invalid filename characters
        }));
        
        if (audioFiles.length === 0) {
          showImportError('No audio files found in tracks data');
          return;
        }

        // Create a new ZIP file
        const zip = new JSZip();
        let completedFiles = 0;
        const totalFiles = audioFiles.length;

        // Show progress notification
        showImportSuccess(`Starting download of ${totalFiles} files...`);

        // Download and add each file to the ZIP
        for (const file of audioFiles) {
          try {
            const response = await fetch(file.url);
            if (!response.ok) throw new Error(`Failed to fetch ${file.filename}`);
            const blob = await response.blob();
            zip.file(file.filename, blob);
            
            completedFiles++;
            showImportSuccess(`Processing files: ${completedFiles}/${totalFiles}`);
          } catch (err) {
            console.error(`Failed to process ${file.filename}:`, err);
          }
        }

        // Generate and download the ZIP file
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const zipBlob = await zip.generateAsync({ type: "blob" });
        const url = window.URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `audio-backup-${timestamp}.zip`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        showImportSuccess(`Successfully exported ${completedFiles} audio files to ZIP`);
      } catch (error) {
        showImportError('Failed to export audio files: ' + error.message);
      }
    }

    function getFileExtension(url) {
      const match = url.match(/\.[0-9a-z]+$/i);
      return match ? match[0] : '';
    }

    async function importSiteData() {
      const fileInput = document.getElementById('siteDataFile');
      const file = fileInput.files[0];
      
      if (!file) {
        showImportError('Please select a file to import');
        return;
      }
      
      if (!confirm('This will replace all current site data (users, comments, activity). Are you sure?')) {
        return;
      }
      
      try {
        const formData = new FormData();
        formData.append('dataFile', file);
        
        const response = await fetch('/api/admin/import/site-data', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
          showImportSuccess(`Site data imported successfully! Backup saved as: ${result.backupFile}`);
          // Reload the page to reflect changes
          setTimeout(() => window.location.reload(), 2000);
        } else {
          throw new Error(result.error || 'Import failed');
        }
      } catch (error) {
        console.error('Import failed:', error);
        showImportError('Failed to import site data: ' + error.message);
      }
    }

    async function importTracks() {
      const fileInput = document.getElementById('tracksDataFile');
      const file = fileInput.files[0];
      
      if (!file) {
        showImportError('Please select a file to import');
        return;
      }
      
      if (!confirm('This will replace all current track data. Are you sure?')) {
        return;
      }
      
      try {
        const formData = new FormData();
        formData.append('dataFile', file);
        
        const response = await fetch('/api/admin/import/tracks', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
          showImportSuccess(`Tracks imported successfully! Backup saved as: ${result.backupFile}`);
        } else {
          throw new Error(result.error || 'Import failed');
        }
      } catch (error) {
        console.error('Import failed:', error);
        showImportError('Failed to import tracks: ' + error.message);
      }
    }

    // Utility functions for import/export success/error messages
    function showImportSuccess(message) {
      const messageHtml = `
        <div id="import-success-message" class="fixed top-4 right-4 bg-green-600 text-white px-4 py-3 rounded-lg shadow-lg z-50">
          <div class="flex items-center">
            <div class="text-xl mr-2">✅</div>
            <div>${message}</div>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', messageHtml);
      
      // Auto-remove after 3 seconds
      setTimeout(() => {
        const msg = document.getElementById('import-success-message');
        if (msg) msg.remove();
      }, 3000);
    }

    function showImportError(message) {
      const messageHtml = `
        <div id="import-error-message" class="fixed top-4 right-4 bg-red-600 text-white px-4 py-3 rounded-lg shadow-lg z-50">
          <div class="flex items-center">
            <div class="text-xl mr-2">❌</div>
            <div>${message}</div>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', messageHtml);
      
      // Auto-remove after 4 seconds
      setTimeout(() => {
        const msg = document.getElementById('import-error-message');
        if (msg) msg.remove();
      }, 4000);
    }

    // User Management Functions
    let allUsers = [];
    let filteredUsers = [];
    let currentPage = 1;
    const usersPerPage = 20;

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth-status');
        const data = await res.json();
        
        if (!data.isAdmin) {
          showError('You must be an administrator to access this page');
          return false;
        }
        return true;
      } catch (error) {
        console.error('Auth check failed:', error);
        showError('Failed to verify authentication');
        return false;
      }
    }

    async function loadUsers() {
      const isAdmin = await checkAuth();
      if (!isAdmin) return;

      try {
        const res = await fetch('/api/admin/users');
        if (!res.ok) {
          throw new Error('Failed to fetch users');
        }
        
        const data = await res.json();
        allUsers = data.users;
        filteredUsers = [...allUsers];
        currentPage = 1;
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('users-container').classList.remove('hidden');
        
        updateStats();
        renderUsers();
        setupSearch();
      } catch (error) {
        console.error('Error loading users:', error);
        showError('Failed to load users');
      }
    }

    function setupSearch() {
      const searchInput = document.getElementById('user-search');
      searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        if (query === '') {
          filteredUsers = [...allUsers];
        } else {
          filteredUsers = allUsers.filter(user => 
            user.username.toLowerCase().includes(query) ||
            user.id.toString().includes(query)
          );
        }
        currentPage = 1;
        updateStats();
        renderUsers();
      });
    }

    function clearSearch() {
      document.getElementById('user-search').value = '';
      filteredUsers = [...allUsers];
      currentPage = 1;
      updateStats();
      renderUsers();
    }

    function updateStats() {
      const statsElement = document.getElementById('user-stats');
      const total = allUsers.length;
      const filtered = filteredUsers.length;
      const active = filteredUsers.filter(u => !u.banned).length;
      const banned = filteredUsers.filter(u => u.banned).length;
      const admins = filteredUsers.filter(u => u.isAdmin).length;
      
      statsElement.innerHTML = `
        Total: ${filtered}${filtered !== total ? ` of ${total}` : ''} | 
        Active: ${active} | 
        Banned: ${banned} | 
        Admins: ${admins}
      `;
    }

    function changePage(direction) {
      const totalPages = Math.ceil(filteredUsers.length / usersPerPage);
      const newPage = currentPage + direction;
      
      if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        renderUsers();
      }
    }

    function renderUsers() {
      const tbody = document.getElementById('users-table-body');
      tbody.innerHTML = '';

      const totalPages = Math.ceil(filteredUsers.length / usersPerPage);
      const startIndex = (currentPage - 1) * usersPerPage;
      const endIndex = startIndex + usersPerPage;
      const usersToShow = filteredUsers.slice(startIndex, endIndex);

      usersToShow.forEach(user => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-700 transition';
        
        const statusBadge = user.banned 
          ? '<span class="bg-red-600 text-white px-2 py-1 rounded text-xs">Banned</span>'
          : user.muted
          ? '<span class="bg-orange-600 text-white px-2 py-1 rounded text-xs">Muted</span>'
          : '<span class="bg-green-600 text-white px-2 py-1 rounded text-xs">Active</span>';
        
        const accountType = user.isAdmin 
          ? '<span class="bg-yellow-600 text-white px-2 py-1 rounded text-xs">Admin</span>'
          : '<span class="bg-blue-600 text-white px-2 py-1 rounded text-xs">User</span>';

        tr.innerHTML = `
          <td class="px-4 py-3">${escapeHtml(user.id)}</td>
          <td class="px-4 py-3">
            <a href="/profile/${user.id}" class="hover:underline text-blue-400">${escapeHtml(user.username)}</a>
          </td>
          <td class="px-4 py-3">${accountType}</td>
          <td class="px-4 py-3">${statusBadge}</td>
          <td class="px-4 py-3">${formatDate(user.createdAt)}</td>
          <td class="px-4 py-3 text-right">
            <div class="flex justify-end gap-2 flex-wrap">
              ${user.id !== '0' ? `
                <button onclick="viewUserComments('${user.id}', '${escapeHtml(user.username)}')" 
                        class="px-2 py-1 rounded text-xs bg-purple-600 hover:bg-purple-700 text-white">
                  Comments
                </button>
                <button onclick="toggleAdmin('${user.id}', ${!user.isAdmin})" 
                        class="px-2 py-1 rounded text-xs ${user.isAdmin ? 'bg-orange-600 hover:bg-orange-700' : 'bg-yellow-600 hover:bg-yellow-700'} text-white">
                  ${user.isAdmin ? 'Demote' : 'Promote'}
                </button>
                <button onclick="toggleMute('${user.id}', ${!user.muted})" 
                        class="px-2 py-1 rounded text-xs ${user.muted ? 'bg-green-600 hover:bg-green-700' : 'bg-orange-600 hover:bg-orange-700'} text-white">
                  ${user.muted ? 'Unmute' : 'Mute'}
                </button>
                <button onclick="toggleBan('${user.id}', ${!user.banned})" 
                        class="px-2 py-1 rounded text-xs ${user.banned ? 'bg-green-600 hover:bg-green-700' : 'bg-yellow-600 hover:bg-yellow-700'} text-white">
                  ${user.banned ? 'Unban' : 'Ban'}
                </button>
                <button onclick="deleteUser('${user.id}', '${escapeHtml(user.username)}')" 
                        class="px-2 py-1 rounded text-xs bg-red-600 hover:bg-red-700 text-white">
                  Delete
                </button>
              ` : '<span class="text-gray-500 text-sm">System Admin</span>'}
            </div>
          </td>
        `;
        
        tbody.appendChild(tr);
      });

      // Update pagination controls
      updatePaginationControls(totalPages);
    }

    function updatePaginationControls(totalPages) {
      const prevButton = document.getElementById('prev-page');
      const nextButton = document.getElementById('next-page');
      const pageInfo = document.getElementById('page-info');
      
      prevButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages || totalPages === 0;
      
      if (totalPages === 0) {
        pageInfo.textContent = 'No users found';
      } else {
        const startUser = (currentPage - 1) * usersPerPage + 1;
        const endUser = Math.min(currentPage * usersPerPage, filteredUsers.length);
        pageInfo.textContent = `${startUser}-${endUser} of ${filteredUsers.length} users (Page ${currentPage} of ${totalPages})`;
      }
    }

    async function toggleBan(userId, shouldBan) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      const action = shouldBan ? 'ban' : 'unban';
      if (!confirm(`Are you sure you want to ${action} ${user.username}?`)) {
        return;
      }

      try {
        const res = await fetch(`/api/admin/users/${userId}/ban`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ banned: shouldBan })
        });

        if (!res.ok) {
          throw new Error('Failed to update user');
        }

        const data = await res.json();
        
        // Update local user data
        const userIndex = allUsers.findIndex(u => u.id === userId);
        if (userIndex !== -1) {
          allUsers[userIndex] = data.user;
          // Update filtered users as well
          const filteredIndex = filteredUsers.findIndex(u => u.id === userId);
          if (filteredIndex !== -1) {
            filteredUsers[filteredIndex] = data.user;
          }
        }
        
        updateStats();
        renderUsers();
        alert(`User ${user.username} has been ${shouldBan ? 'banned' : 'unbanned'} successfully`);
      } catch (error) {
        console.error('Error toggling ban:', error);
        alert('Failed to update user status');
      }
    }

    async function toggleMute(userId, shouldMute) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      const action = shouldMute ? 'mute' : 'unmute';
      if (!confirm(`Are you sure you want to ${action} ${user.username}?${shouldMute ? ' They will not be able to comment.' : ''}`)) {
        return;
      }

      try {
        const res = await fetch(`/api/admin/users/${userId}/mute`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ muted: shouldMute })
        });

        if (!res.ok) {
          throw new Error('Failed to update user');
        }

        const data = await res.json();
        
        // Update local user data
        const userIndex = allUsers.findIndex(u => u.id === userId);
        if (userIndex !== -1) {
          allUsers[userIndex] = data.user;
          const filteredIndex = filteredUsers.findIndex(u => u.id === userId);
          if (filteredIndex !== -1) {
            filteredUsers[filteredIndex] = data.user;
          }
        }
        
        updateStats();
        renderUsers();
        alert(`User ${user.username} has been ${shouldMute ? 'muted' : 'unmuted'} successfully`);
      } catch (error) {
        console.error('Error toggling mute:', error);
        alert('Failed to update user status');
      }
    }

    async function toggleAdmin(userId, shouldBeAdmin) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      const action = shouldBeAdmin ? 'promote to admin' : 'demote from admin';
      if (!confirm(`Are you sure you want to ${action} ${user.username}?`)) {
        return;
      }

      try {
        const res = await fetch(`/api/admin/users/${userId}/admin`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isAdmin: shouldBeAdmin })
        });

        if (!res.ok) {
          throw new Error('Failed to update user');
        }

        const data = await res.json();
        
        // Update local user data
        const userIndex = allUsers.findIndex(u => u.id === userId);
        if (userIndex !== -1) {
          allUsers[userIndex] = data.user;
          const filteredIndex = filteredUsers.findIndex(u => u.id === userId);
          if (filteredIndex !== -1) {
            filteredUsers[filteredIndex] = data.user;
          }
        }
        
        updateStats();
        renderUsers();
        alert(`User ${user.username} has been ${shouldBeAdmin ? 'promoted to admin' : 'demoted from admin'} successfully`);
      } catch (error) {
        console.error('Error toggling admin status:', error);
        alert('Failed to update user admin status');
      }
    }

    async function viewUserComments(userId, username) {
      try {
        const res = await fetch(`/api/admin/users/${userId}/comments`);
        if (!res.ok) {
          throw new Error('Failed to fetch user comments');
        }

        const data = await res.json();
        const comments = data.comments;

        // Create modal for showing comments
        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
        modal.innerHTML = `
          <div class="bg-gray-800 rounded-lg p-6 max-w-4xl max-h-screen overflow-y-auto w-full mx-4">
            <h3 class="text-xl font-bold mb-4">Comments by ${escapeHtml(username)} (${comments.length} total)</h3>
            <div class="space-y-4 max-h-96 overflow-y-auto">
              ${comments.length === 0 ? 
                '<p class="text-gray-400">No comments found.</p>' :
                comments.map(comment => `
                  <div class="bg-gray-700 p-4 rounded border-l-4 border-blue-500">
                    <div class="flex justify-between items-start mb-2">
                      <div class="text-sm text-gray-400">
                        Track: <span class="text-blue-400">${escapeHtml(comment.trackTitle || 'Unknown')}</span>
                        by <span class="text-blue-400">${escapeHtml(comment.trackArtist || 'Unknown')}</span>
                      </div>
                      <div class="text-xs text-gray-500">
                        ${formatDate(comment.createdAt)}
                        ${comment.editedAt ? ` (edited ${formatDate(comment.editedAt)})` : ''}
                      </div>
                    </div>
                    <p class="text-white">${escapeHtml(comment.text)}</p>
                    <div class="mt-2 flex gap-2">
                      <button onclick="deleteComment('${comment.id}', '${comment.trackKey}', '${escapeHtml(username)}')" 
                              class="px-2 py-1 bg-red-600 hover:bg-red-700 text-white text-xs rounded">
                        Delete
                      </button>
                    </div>
                  </div>
                `).join('')
              }
            </div>
            <div class="mt-6 flex justify-end">
              <button onclick="this.closest('.fixed').remove()" 
                      class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded">
                Close
              </button>
            </div>
          </div>
        `;
        
        document.body.appendChild(modal);
        
        // Close modal when clicking outside
        modal.addEventListener('click', function(e) {
          if (e.target === modal) {
            modal.remove();
          }
        });
      } catch (error) {
        console.error('Error viewing user comments:', error);
        alert('Failed to load user comments');
      }
    }

    async function deleteComment(commentId, trackKey, username) {
      if (!confirm(`Delete this comment by ${username}?`)) {
        return;
      }

      try {
        const [artistSlug, songSlug] = trackKey.split('/');
        const res = await fetch(`/api/comments/${artistSlug}/${songSlug}/${commentId}`, {
          method: 'DELETE'
        });

        if (!res.ok) {
          throw new Error('Failed to delete comment');
        }

        alert('Comment deleted successfully');
        // Close and reopen the modal to refresh
        document.querySelector('.fixed').remove();
      } catch (error) {
        console.error('Error deleting comment:', error);
        alert('Failed to delete comment');
      }
    }

    async function deleteUser(userId, username) {
      if (!confirm(`Are you sure you want to permanently delete ${username}? This action cannot be undone.`)) {
        return;
      }

      if (!confirm(`This will delete ALL data associated with ${username}. Are you absolutely sure?`)) {
        return;
      }

      try {
        const res = await fetch(`/api/admin/users/${userId}`, {
          method: 'DELETE'
        });

        if (!res.ok) {
          throw new Error('Failed to delete user');
        }

        // Remove from local array
        allUsers = allUsers.filter(u => u.id !== userId);
        renderUsers();
        
        alert(`User ${username} has been deleted successfully`);
      } catch (error) {
        console.error('Error deleting user:', error);
        alert('Failed to delete user');
      }
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showError(message) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error-container').classList.remove('hidden');
      document.getElementById('error-message').textContent = message;
    }

    // Load users on page load
    loadUsers();
  </script>
</body>
</html>
