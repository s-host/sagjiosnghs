<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Track | HyperTunes</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">
  <main class="p-6 max-w-xl mx-auto">
    <h2 class="text-2xl font-bold mb-4">Edit Track</h2>
    <form id="editTrackForm" class="space-y-4">
      <input name="title" placeholder="Song Title" class="w-full p-2 rounded bg-gray-700" required />
      <input name="artist" placeholder="Artist" class="w-full p-2 rounded bg-gray-700" required />
      <input name="album" placeholder="Album" class="w-full p-2 rounded bg-gray-700" />
      <input name="cover" placeholder="Cover Image URL" class="w-full p-2 rounded bg-gray-700" />
      
      <div class="space-y-2">
        <label class="block text-sm font-medium">Audio File</label>
        <div class="flex gap-2 items-center">
          <input name="file" placeholder="Audio File URL (MP3/WAV)" class="flex-1 p-2 rounded bg-gray-700" />
          <button type="button" id="downloadAudio" class="bg-blue-600 hover:bg-blue-700 px-3 py-2 rounded text-white">
            Download
          </button>
        </div>
        <div class="text-sm text-gray-400">OR upload a new file:</div>
        <input type="file" name="audioFile" accept=".mp3,.wav,.ogg,.m4a" class="w-full p-2 rounded bg-gray-700 text-white" />
      </div>
      
      <div class="flex gap-4">
        <label><input type="checkbox" name="isNew" /> New</label>
        <label><input type="checkbox" name="isPopular" /> Popular</label>
        <label><input type="checkbox" name="isFeatured" /> Featured</label>
        <label><input type="checkbox" name="isClean" /> Clean</label>
      </div>
      <input name="albumNumber" placeholder="Track #" class="w-full p-2 rounded bg-gray-700" />
      <button type="submit" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-white">Save Changes</button>
      <button onclick="window.location.href='/'" type="button" class="ml-4 text-red-400 hover:underline">Cancel</button>
    </form>
  </main>
  <script>
  // Load original track details
  async function loadEditTrack() {
    const artistSlug = localStorage.getItem('editTrackArtistSlug');
    const titleSlug = localStorage.getItem('editTrackTitleSlug');
    const res = await fetch("/api/tracks");
    let tracks = await res.json();
    // Add slug fields:
    function slugify(str) {
      return str.toLowerCase().replace(/'/g, '').replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '');
    }
    // Add slugs to each track for lookup!
    tracks = tracks.map(t => ({
      ...t,
      slugArtist: slugify(t.artist),
      slugTitle: slugify(t.title)
    }));
    const track = tracks.find(
      t => t.slugArtist === artistSlug && t.slugTitle === titleSlug
    );
    if (!track) { alert("Track not found!"); window.location.href = '/'; return; }
    // Fill form
    const form = document.getElementById("editTrackForm");
    form.title.value = track.title;
    form.artist.value = track.artist;
    form.album.value = track.album || '';
    form.cover.value = track.cover || '';
    form.file.value = track.file || '';
    form.isNew.checked = !!track.isNew;
    form.isPopular.checked = !!track.isPopular;
    form.isFeatured.checked = !!track.isFeatured;
    form.isClean.checked = !!track.isClean;
    form.albumNumber.value = track.albumNumber || '';
  }
  loadEditTrack();

  // Add download button functionality
  document.getElementById("downloadAudio").addEventListener("click", async function() {
    const fileUrl = document.querySelector('input[name="file"]').value;
    if (!fileUrl) {
      alert("No audio file URL available");
      return;
    }
    try {
      // Create a temporary anchor to trigger download
      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = fileUrl.split('/').pop(); // Get filename from URL
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch (error) {
      alert("Error downloading file: " + error.message);
    }
  });

  document.getElementById("editTrackForm").onsubmit = async function (e) {
    e.preventDefault();
    const form = e.target;
    const artistSlug = localStorage.getItem('editTrackArtistSlug');
    const titleSlug = localStorage.getItem('editTrackTitleSlug');
    
    try {
      // Check if a new audio file was uploaded
      const audioFile = form.audioFile.files[0];
      let newFilePath = form.file.value;
      
      if (audioFile) {
        // Upload the new audio file first
        const fileFormData = new FormData();
        fileFormData.append('audioFile', audioFile);
        
        const fileUploadRes = await fetch(`/api/tracks/${artistSlug}/${titleSlug}/file`, {
          method: 'PUT',
          body: fileFormData
        });
        
        if (fileUploadRes.ok) {
          const fileResult = await fileUploadRes.json();
          newFilePath = fileResult.newFilePath;
          alert('Audio file uploaded successfully!');
        } else {
          const error = await fileUploadRes.json();
          alert('File upload failed: ' + error.error);
          return;
        }
      }
      
      // Prepare track data
      const updatedTrack = {
        title: form.title.value,
        artist: form.artist.value,
        album: form.album.value,
        cover: form.cover.value,
        file: newFilePath,
        isNew: form.isNew.checked,
        isPopular: form.isPopular.checked,
        isFeatured: form.isFeatured.checked,
        isClean: form.isClean.checked,
        albumNumber: form.albumNumber.value
      };
      
      // Update track metadata
      const updateRes = await fetch(`/api/tracks/${artistSlug}/${titleSlug}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updatedTrack)
      });
      
      if (updateRes.ok) {
        alert("Track updated successfully!");
        window.location.href = '/';
      } else {
        const error = await updateRes.text();
        alert("Update failed: " + error);
      }
    } catch (error) {
      console.error('Update error:', error);
      alert("Update failed: " + error.message);
    }
  }
</script>
</body>
</html>
